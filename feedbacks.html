<!-- Modal de Feedbacks -->
<div id="feedbackModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h2>Feedbacks Recebidos</h2>
    <ul id="feedbackList">
      <!-- Feedbacks serão inseridos aqui dinamicamente -->
    </ul>
  </div>
</div>

<!-- Botão para abrir o modal -->
<button onclick="openModal()" class="feedback-btn">Ver Feedbacks</button>

<script>
  // Exemplo de feedbacks (pode ser substituído por dados reais)
  const feedbacks = [
    "Ótimo site, muito intuitivo!",
    "Gostei do quiz, parabéns!",
    "Poderia ter mais perguntas sobre JavaScript."
  ];

  function openModal() {
    document.getElementById('feedbackModal').style.display = 'block';
    const list = document.getElementById('feedbackList');
    list.innerHTML = '';
    feedbacks.forEach(fb => {
      const li = document.createElement('li');
      li.textContent = fb;
      list.appendChild(li);
    });
  }

  function closeModal() {
    document.getElementById('feedbackModal').style.display = 'none';
  }

  // Fecha o modal ao clicar fora dele
  window.onclick = function(event) {
    const modal = document.getElementById('feedbackModal');
    if (event.target == modal) {
      closeModal();
    }
  }
</script>
